[/Script/Engine.RendererSettings]
; --- Hardware ray tracing + Lumen (realism baseline, ue5-realism-plan 2.1) ---
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
; Hit Lighting for Reflections (plan 6.2 / 6.6 / 9.4 High+): balls mirror the fully lit lamp, room and other balls,
; not the Lumen surface cache (the 5.8 default 0). Low / Medium presets lower it at runtime (UE-8, review R-03).
r.Lumen.HardwareRayTracing.LightingMode=2
r.Lumen.TraceMeshSDFs=0
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
; TSR as default AA (DLSS added later as plugin)
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=True
r.AllowStaticLighting=False
; Substrate with the Adaptive (bitstream) GBuffer: project-wide, decided before any material exists
; (ue5-realism-plan 6.0, pitfall 14; Docs/ue-architecture.md 8.2)
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1
; PSO precaching against shader stutter (plan 2.1, pitfall 18)
r.PSOPrecaching=1
; M2 (Docs/ue-architecture.md 18.9, venue-dive-bar H-3): streaming + runtime virtual textures for the venue materials (floor
; RVT masks, 4K+ hero textures). Project-wide shader recompile: switched on once in the M2 architect step, before any package
; renders.
r.VirtualTextures=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
; --- audio block (owner M2-C; Docs/specs/audio.md 5.1 / 7.4, Docs/ue-architecture.md 18.5) -----------------------------------
; 48 kHz, 512-frame blocks x 2 buffers (~21 ms like the 1024 x 1 default, half the anchor granularity of the table voices). M2-C
; may change these lines (AU-0: underruns -> back to 1024 x 1) and add the spatialisation / reverb plugin lines here.
; AU-0 (Docs/audio/m2/au0.md): 512 x 2 kept - one generator callback per 512-frame block, 0 samples inter-voice skew, L_src 0.
AudioSampleRate=48000
AudioCallbackBufferFrameSize=512
AudioNumBuffersToEnqueue=2
AudioMaxChannels=96
AudioNumSourceWorkers=4

[/Script/Engine.AudioSettings]
; The device's channel limit is min(AudioMaxChannels, the audio quality level's MaxChannels); the engine's only default level
; allows 32, fewer than one T0 table's 30 synth voices + the room's ambience + footsteps (a voice beyond the limit never gets a
; mixer source). One level with the audio.md 7.4 budget: 30 per T0 table + 4 per T1 + ambience, foley, crowd, voice, music.
!QualityLevels=ClearArray
+QualityLevels=(DisplayName=NSLOCTEXT("RbAudio", "RbAudioQualityDefault", "Default"),MaxChannels=96)
; Power-preserving panning and mono upmix (the engine defaults are linear: a source straight ahead 3 dB weaker than one at the side).
; The voices' compensation for the resulting path gains is URbAudioSettings::PanCompensation / NonSpatialCompensation (AU-0 probes).
PanningMethod=EqualPower
MonoChannelUpmixMethod=EqualPower
; --- end of the audio block ---------------------------------------------------------------------------------------------------

[/Script/Engine.Engine]
