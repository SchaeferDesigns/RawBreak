[/Script/Engine.CollisionProfile]
; M2 (Docs/ue-architecture.md 18.9; venue-dive-bar 13.5, H-1 / H-3; names in RbAssetPaths::Collision - C++ never uses the raw
; channel numbers).
;   RbCueSweep  (trace, ECC_GameTraceChannel1)  the cue's environment sweep (RbCueClearance::SweepEnvironment, M2-F switches to it);
;               default Block: every existing wall / furniture blocks the cue; pawns, clutter and loose balls ignore it.
;   RbLooseBall (object, ECC_GameTraceChannel2) balls that left the table (ARbLooseBall, M2-E); default Block: walls, floors,
;               furniture and the table body stop them; pawns ignore them.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="RbCueSweep")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="RbLooseBall")
+Profiles=(Name="RbVenueBlock",CollisionEnabled=QueryAndPhysics,bCanModify=False,ObjectTypeName="WorldStatic",CustomResponses=((Channel="RbCueSweep",Response=ECR_Block),(Channel="RbLooseBall",Response=ECR_Block)),HelpMessage="Venue walls, columns and furniture: block the pawn, the cue sweep and loose balls.")
+Profiles=(Name="RbVenueProp",CollisionEnabled=QueryOnly,bCanModify=False,ObjectTypeName="WorldStatic",CustomResponses=((Channel="Pawn",Response=ECR_Ignore),(Channel="RbCueSweep",Response=ECR_Ignore),(Channel="RbLooseBall",Response=ECR_Ignore)),HelpMessage="Venue clutter: query only (gaze traces), no pawn block, not in the cue sweep.")
+Profiles=(Name="RbLooseBall",CollisionEnabled=QueryAndPhysics,bCanModify=False,ObjectTypeName="RbLooseBall",CustomResponses=((Channel="Pawn",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="RbCueSweep",Response=ECR_Ignore)),HelpMessage="A ball off the table under engine physics (ARbLooseBall).")
+Profiles=(Name="RbBallReturn",CollisionEnabled=QueryOnly,bCanModify=False,ObjectTypeName="WorldStatic",CustomResponses=((Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore),(Channel="RbCueSweep",Response=ECR_Ignore),(Channel="RbLooseBall",Response=ECR_Overlap)),HelpMessage="Overlap volume: a loose ball resting here is handed back automatically.")
+EditProfiles=(Name="Pawn",CustomResponses=((Channel="RbCueSweep",Response=ECR_Ignore),(Channel="RbLooseBall",Response=ECR_Ignore)))

