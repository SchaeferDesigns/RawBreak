[/Script/Engine.InputSettings]
; Enhanced Input everywhere. Input actions and the mapping context are created at runtime in C++
; (URbInputSetup, Docs/ue-architecture.md 6.5), so no input assets have to be authored in the editor.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
; the console stays available in development builds (headless tests drive cheats via -ExecCmds)
+ConsoleKeys=Tilde
; German keyboards: the key left of 1 (^) - the M1 build has no settings menu, the quality presets are console commands
+ConsoleKeys=Caret
; M2-F (P3, Docs/ue-architecture.md 18.3): the Look action carries RAW mouse counts. The engine's BaseInput.ini scales every mouse
; axis by 0.07 (Enhanced Input turns that into a hidden Scalar modifier on every mouse mapping) and smooths the mouse; RAW BREAK maps
; counts -> cm (MouseDpi) -> degrees itself (RbAimResponse), so the axes are neutral here (ARbPlayerController re-asserts it at
; runtime) and smoothing / view acceleration are off.
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
bEnableFOVScaling=False
-AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=0.07f))
-AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=0.07f))
-AxisConfig=(AxisKeyName="Mouse2D",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=0.07f))
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=1.f))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=1.f))
+AxisConfig=(AxisKeyName="Mouse2D",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=1.f))
