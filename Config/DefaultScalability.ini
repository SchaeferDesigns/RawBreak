; RAW BREAK quality presets (Docs/ue-architecture.md 8.1, ue5-realism-plan 9.4). Owner: UE-8.
;
; QUALITY FIRST (plan 9.1, decisions 2026-09-27): Epic and Cinematic are authored for the best possible image and are never
; capped to the development PC; the RTX 3070 Ti defines the High test tier only. Presets fill in defaults, every option stays
; individually adjustable (URbGameUserSettings, rb.Quality / rb.Quality.Option).
;
; Levels: 0 Low (Steam Deck class), 1 Medium, 2 High (3070 Ti, M1 default), 3 Epic, Cine = Cinematic (UE's level 4).
;
; Two kinds of sections:
;   [<Group>@<level>]           engine scalability groups (sg.*), merged over Engine/Config/BaseScalability.ini at
;                               ECVF_SetByScalability. Only the rows where plan 9.4 differs from the engine are listed.
;   [RawBreak.<Option>@<level>] RAW BREAK rows, applied by URbGameUserSettings::ApplyQualityRows after the groups at
;                               ECVF_SetByGameOverride: they follow that option's own level (Custom mixes stay consistent) and
;                               outrank project settings (DefaultEngine.ini sets r.Lumen.HardwareRayTracing.LightingMode=2).
;   [RawBreak.Preset@<level>]   per-preset values that are not console variables (internal resolution).
;
; Plan 9.4 rows not wired yet (no plugin / feature in M1): DLSS / Ray Reconstruction / DLAA / frame generation (the DLSS
; plugin replaces TSR later; the screen percentages below are its input), hero texture resolution (texture assets later),
; forearm hair / fabric (body later), MegaLights (pool hall; the key table lamp stays a classic VSM light, plan 6.1),
; ray-traced shadows on the key lamp and the path tracer (Cinematic photo mode / Movie Render Queue later).

;-----------------------------------------------------------------------------------------------------------------------
; Internal resolution = upscaler input (TSR now, DLSS later): Low TSR ~55 %, Medium DLSS Balanced, High DLSS Quality,
; Epic DLSS Quality (DLAA = 100 as an individual option), Cinematic DLAA / native.

[RawBreak.Preset@0]
ScreenPercentage=55

[RawBreak.Preset@1]
ScreenPercentage=58.328

[RawBreak.Preset@2]
ScreenPercentage=66.662

[RawBreak.Preset@3]
ScreenPercentage=66.662

[RawBreak.Preset@Cine]
ScreenPercentage=100

;-----------------------------------------------------------------------------------------------------------------------
; Global illumination. Engine: Low = no Lumen, Medium = Lumen irradiance-field gather ("Lumen Lite", 5.8 Beta), High+ = screen
; probe gather. Plan: Low and Medium both Lumen Lite, High+ HWRT Lumen (engine High / Epic / Cine gathers).

[GlobalIlluminationQuality@0]
r.DistanceFieldAO=1
r.SkylightIntensityMultiplier=1.0
r.AOQuality=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.FinalGatherMethod=0
r.LumenScene.SurfaceCache.AtlasSize=2048
r.LumenScene.SurfaceCache.CardTexelDensityScale=50
r.LumenScene.SurfaceCache.CardMinResolution=2
r.LumenScene.SurfaceCache.CardMaxResolution=256
r.LumenScene.DirectLighting.MaxLightsPerTile=4
r.LumenScene.DirectLighting.UpdateFactor=128
r.LumenScene.Radiosity.UpdateFactor=128
r.LumenScene.Radiosity.ProbeSpacing=4
r.LumenScene.Radiosity.HemisphereProbeResolution=3
r.Lumen.TraceMeshSDFs.Allow=0
r.Lumen.ScreenProbeGather.ShortRangeAO.DownsampleFactor=1
r.Lumen.ScreenProbeGather.ShortRangeAO.HorizonSearch.SliceCount=1

;-----------------------------------------------------------------------------------------------------------------------
; Reflections. Engine Medium = SSR only; plan Medium = HWRT Lumen reflections from the surface cache (the balls must mirror
; the lamp and the room behind the player, plan 6.6: screen space cannot show what is off-screen).

[ReflectionQuality@1]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.ScreenSpaceReconstruction.NumSamples=3

; Ray hit lighting (the lamp, the player and the room fully lit in every ball, plan 6.2 / 6.6): off on Low / Medium (surface
; cache), Hit Lighting for Reflections from High up. The engine's GI group forbids hit lighting below Epic
; (HitLighting.Allowed=0 at GI@2); the reflection row decides here (review R-03).
[RawBreak.ReflectionQuality@0]
r.Lumen.HardwareRayTracing.LightingMode=0
r.Lumen.HardwareRayTracing.HitLighting.Allowed=0

[RawBreak.ReflectionQuality@1]
r.Lumen.HardwareRayTracing.LightingMode=0
r.Lumen.HardwareRayTracing.HitLighting.Allowed=0

[RawBreak.ReflectionQuality@2]
r.Lumen.HardwareRayTracing.LightingMode=2
r.Lumen.HardwareRayTracing.HitLighting.Allowed=1

[RawBreak.ReflectionQuality@3]
r.Lumen.HardwareRayTracing.LightingMode=2
r.Lumen.HardwareRayTracing.HitLighting.Allowed=1

[RawBreak.ReflectionQuality@Cine]
r.Lumen.HardwareRayTracing.LightingMode=2
r.Lumen.HardwareRayTracing.HitLighting.Allowed=1

;-----------------------------------------------------------------------------------------------------------------------
; Textures: streaming pool 1000 / 1500 / 2500 / 3500 (>= 12 GB GPUs) / 4500 MB (plan 9.3 / 9.4); 16x anisotropic filtering from
; High up for the cloth seen at 5-10 deg grazing angles (plan 6.3).

[TextureQuality@0]
r.Streaming.PoolSize=1000
r.MaxAnisotropy=4

[TextureQuality@1]
r.Streaming.PoolSize=1500
r.MaxAnisotropy=8

[TextureQuality@2]
r.Streaming.PoolSize=2500
r.MaxAnisotropy=16
r.VT.MaxAnisotropy=16

[TextureQuality@3]
r.Streaming.PoolSize=3500
r.MaxAnisotropy=16
r.VT.MaxAnisotropy=16

[TextureQuality@Cine]
r.Streaming.PoolSize=4500
r.MaxAnisotropy=16
r.VT.MaxAnisotropy=16

;-----------------------------------------------------------------------------------------------------------------------
; Volumetric fog (lamp cone haze in venues, plan 6.1): off / low / on / on / high. Its own option; the engine toggles it in the
; shadow group, the RAW BREAK row outranks that.

[RawBreak.VolumetricFog@0]
r.VolumetricFog=0

[RawBreak.VolumetricFog@1]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64

[RawBreak.VolumetricFog@2]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=128

[RawBreak.VolumetricFog@3]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=128

[RawBreak.VolumetricFog@Cine]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=4
r.VolumetricFog.GridSizeZ=128
r.VolumetricFog.HistoryMissSupersampleCount=16

;-----------------------------------------------------------------------------------------------------------------------
; Shadows: Low renders local-light VSM one level coarser (engine ShadowQuality@0: ResolutionLodBiasLocal=1, as plan 9.4 asks).
; The engine's Low also sets r.ShadowQuality=0, which switches dynamic shadows off altogether (no ball, table or lamp shadows
; at all - balls float on the cloth); plan 9.4 keeps VSM on Low, so shadows stay on (hard local-light shadows, SMRT ray count 0).
; The engine's Low / Medium page pool (512 pages) overflows with the M1 room's 14 shadowed rect lights (8 lamp sections + 6
; ceiling panels) in a close view of the rack ("Page Pool overflow ... missing shadow"): 1024 pages (64 MB) on both.
; Cinematic sharpens the key lamp's shadow pages.

[ShadowQuality@0]
r.ShadowQuality=2
r.Shadow.Virtual.MaxPhysicalPages=1024

[ShadowQuality@1]
r.Shadow.Virtual.MaxPhysicalPages=1024

[RawBreak.ShadowQuality@Cine]
r.Shadow.Virtual.ResolutionLodBiasLocal=-0.5

;-----------------------------------------------------------------------------------------------------------------------
; Ball SSS / haze lobe (plan 9.4): material Quality Switch through r.MaterialQualityLevel in the engine's effects group:
; Low 0 (off), Medium 2 (haze only), High / Epic / Cinematic 1 (on). UE-3's materials put the full lobes on the High pin.
